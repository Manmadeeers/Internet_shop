services:
  postgres:
    image: postgres:16-alpine
    container_name: internet-shop-db
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: internet_shop_db
    ports:
      - "5432:5432"
    volumes:
      - internet_shop_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop_user -d internet_shop_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-replica:
    image: postgres:16-alpine
    container_name: internet-shop-replica
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: internet_shop_db
    ports:
      - "5433:5432"
    volumes:
      - internet_shop_replica_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop_user -d internet_shop_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  internet_shop_data:
  internet_shop_replica_data: